name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEMO_MODE: "true"
  BILLING_PROVIDER: mock
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:43127
  NEXT_PUBLIC_APP_NAME: UNISON
  NEXT_PUBLIC_SUPABASE_URL: ""
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
  SUPABASE_SERVICE_ROLE_KEY: ""
  SUPABASE_JWT_SECRET: ""
  DATABASE_URL: ""
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ""
  EXPO_PUBLIC_API_URL: http://127.0.0.1:43127
  EXPO_PUBLIC_SUPABASE_URL: ""
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ""
  RATE_LIMIT_ENABLED: "true"
  CSP_ENABLED: "true"
  CI: "true"

jobs:
  quality:
    name: Install · typecheck · lint · unit · tenant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (lockfile enforced)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests (turbo)
        run: pnpm test

      - name: Multi-tenant / security tests
        run: pnpm test:security

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (lockfile enforced)
        run: pnpm install --frozen-lockfile

      - name: Build web (+ workspace deps)
        run: pnpm --filter @unison/web build

  mobile:
    name: Mobile validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (lockfile enforced)
        run: pnpm install --frozen-lockfile

      - name: Validate mobile (config + typecheck)
        run: pnpm ci:mobile

  desktop:
    name: Desktop build validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (lockfile enforced)
        run: pnpm install --frozen-lockfile

      - name: Validate desktop scaffold
        run: pnpm ci:desktop
        env:
          RUST_CI: "0"

  database:
    name: DB migration / schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (lockfile enforced)
        run: pnpm install --frozen-lockfile

      - name: Validate migrations + RLS
        run: pnpm ci:db

      - name: Database package tests
        run: pnpm --filter @unison/database test

  security:
    name: Secrets · credentials · audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (lockfile enforced)
        run: pnpm install --frozen-lockfile

      - name: Verify no credentials committed
        run: pnpm ci:secrets

      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Gitleaks secret scan
        run: gitleaks detect --source . --verbose --redact --config .gitleaks.toml

      - name: Dependency vulnerability scan
        run: pnpm ci:audit
